name: Daily Scrape

on:
  schedule:
    # 10:00 UTC = 6:00 AM EDT / 5:00 AM EST — obits post overnight, leads are ready by breakfast
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Listing pages to scrape per source (2 = ~last 2-3 days)'
        default: '2'
        required: false

# Needed so the job can commit data/leads.json back to the repo
permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          MD_OPENDATA_USERNAME: ${{ secrets.MD_OPENDATA_USERNAME }}
          MD_OPENDATA_PASSWORD: ${{ secrets.MD_OPENDATA_PASSWORD }}
          MD_OPENDATA_APP_TOKEN: ${{ secrets.MD_OPENDATA_APP_TOKEN }}
          SCRAPE_MAX_PAGES: ${{ github.event.inputs.max_pages || '2' }}
        run: python pipeline.py

      - name: Commit results
        run: |
          git config user.name "md-property-leads bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads.json data/seen.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          NEW=$(python -c "import json;print(json.load(open('data/leads.json'))['last_run']['leads_created'])")
          TOTAL=$(python -c "import json;print(len(json.load(open('data/leads.json'))['leads']))")
          git commit -m "Daily scrape: ${NEW} new leads (${TOTAL} total)"
          git pull --rebase origin main
          git push
