name: Judgment Watch (Lien Leverage)

# Pull every judgment / lien recorded in all 24 Maryland jurisdictions from the Maryland Judiciary
# Judgment and Liens Search (by county + date, no names needed), keep the open ones, and match the
# debtors to SDAT property owners for the Lien Leverage tab.
#
# Speed: history is split into county x 2-year shards that run as parallel GitHub jobs (up to 10 at
# once). Each run pulls the newest shard of every county (new filings + payoffs) and keeps loading
# any older shard that isn't finished. The first Tuesday of each month re-pulls every shard so
# payoffs of old liens drop out. Runs on GitHub's free minutes (no Claude credits).

on:
  schedule:
    - cron: '23 8 * * 2'      # Tuesday 4:23 AM ET
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Re-pull every shard (picks up payoffs of old liens)'
        default: 'false'
        required: false
      parallel:
        description: 'How many shards to pull at once'
        default: '10'
        required: false

permissions:
  contents: write

concurrency:
  group: judgment-watch
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      refresh: ${{ steps.plan.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - id: plan
        run: |
          R=""
          if [ "${{ github.event.inputs.refresh }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -le 7 ]; }; then R="--refresh"; fi
          echo "refresh=$R" >> "$GITHUB_OUTPUT"
          M=$(python -m engine2.judgment_watch plan $R)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "$M" | python -c "import json,sys;print(len(json.load(sys.stdin)['include']),'shards to pull')"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.parallel || '10') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install requests==2.31.0
      - name: Pull ${{ matrix.county }} shard ${{ matrix.shard }}
        continue-on-error: true
        run: python -m engine2.judgment_watch fetch --county "${{ matrix.county }}" --shard ${{ matrix.shard }} --budget-min 320 ${{ needs.plan.outputs.refresh }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-${{ matrix.county }}-s${{ matrix.shard }}
          path: data/judgments/raw/${{ matrix.county }}.s${{ matrix.shard }}.json.gz
          if-no-files-found: ignore
          retention-days: 3

  match:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install requests==2.31.0
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          merge-multiple: true
          path: data/judgments/raw

      - name: Compute cache key (ISO week)
        id: week
        run: echo "key=sdat-index-v2-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore SDAT index
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/sdat.sqlite
          key: ${{ steps.week.outputs.key }}
      - name: Build SDAT index (only if this week's cache is missing)
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          MD_OPENDATA_USERNAME: ${{ secrets.MD_OPENDATA_USERNAME }}
          MD_OPENDATA_PASSWORD: ${{ secrets.MD_OPENDATA_PASSWORD }}
          MD_OPENDATA_APP_TOKEN: ${{ secrets.MD_OPENDATA_APP_TOKEN }}
        run: python -m engine2.build_index
      - name: Save SDAT index
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sdat.sqlite
          key: ${{ steps.week.outputs.key }}

      - name: Match debtors to property owners
        id: match
        continue-on-error: true
        run: python -m engine2.judgment_watch match --index .cache/sdat.sqlite

      - name: Commit results
        run: |
          git config user.name "md-property-leads bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r data/judgments /tmp/out/
          git fetch origin main
          git checkout -f -B main origin/main
          mkdir -p data/judgments && cp -r /tmp/out/judgments/. data/judgments/
          git add data/judgments
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          N=$(python -c "import json;d=json.load(open('data/judgments/leads.json'));print(len(d['rows']))" 2>/dev/null || echo "?")
          git commit -m "Judgment watch: ${N} parcels with open liens on the owner"
          git push origin main
      - name: Fail if matching failed
        if: steps.match.outcome == 'failure'
        run: exit 1
