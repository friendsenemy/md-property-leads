name: Facebook Audiences

# Rebuilds both Facebook custom audiences every weekday:
#  - "MD Probate PRs": estates from the probate sheet whose decedent still owns
#    Maryland property; sold/transferred or >12-month-old estates drop out.
#  - "Pre-Probate Heirs MD": verified heirs from the sheet's PreProbate tab
#    (deaths in the last 6 months, name-only guesses excluded).
# Nothing is committed - phones/emails go straight to Meta (hashed) and the
# log shows counts only.

on:
  schedule:
    # 13:23 UTC = 8:23 AM EST / 9:23 AM EDT, Mon-Fri, after the 7 AM heir trace
    # and the 8 AM Register of Wills run have finished writing to the sheet
    - cron: '23 13 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (count only, do not touch the Meta audience)'
        type: boolean
        default: true
      months:
        description: 'Keep estates opened in the last N months'
        default: '12'

permissions:
  contents: read

concurrency:
  group: pr-audience
  cancel-in-progress: false

jobs:
  audience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests==2.31.0

      - name: Rebuild PR audience
        env:
          MD_OPENDATA_USERNAME: ${{ secrets.MD_OPENDATA_USERNAME }}
          MD_OPENDATA_PASSWORD: ${{ secrets.MD_OPENDATA_PASSWORD }}
          MD_OPENDATA_APP_TOKEN: ${{ secrets.MD_OPENDATA_APP_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PR_AUDIENCE_ID: '120249632120970142'   # "MD Probate PRs" in Pages of Purpose Ads
          PR_SKIP_SUPPLEMENT: ${{ secrets.PR_SKIP_SUPPLEMENT }}
        run: |
          ARGS="--months ${{ github.event.inputs.months || '12' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python pr_audience.py $ARGS

      - name: Rebuild heir audience
        if: always()
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_HEIR_AUDIENCE_ID: '120249612365570142'   # "Pre-Probate Heirs MD" in Pages of Purpose Ads
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python heir_audience.py $ARGS
