name: Probate PR Audience

# Rebuilds the "MD Probate PRs" Facebook custom audience every weekday:
# new estates from the probate sheet whose decedent still owns Maryland
# property go in; estates whose house sold/transferred, or that were opened
# more than 12 months ago, drop out. Nothing is committed - the reps' phones
# go straight to Meta (hashed) and the log shows counts only.

on:
  schedule:
    # 11:23 UTC = 6:23 AM EST / 7:23 AM EDT, Mon-Fri, after the sheet's overnight runs
    - cron: '23 11 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (count only, do not touch the Meta audience)'
        type: boolean
        default: true
      months:
        description: 'Keep estates opened in the last N months'
        default: '12'

permissions:
  contents: read

concurrency:
  group: pr-audience
  cancel-in-progress: false

jobs:
  audience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests==2.31.0

      - name: Rebuild audience
        env:
          MD_OPENDATA_USERNAME: ${{ secrets.MD_OPENDATA_USERNAME }}
          MD_OPENDATA_PASSWORD: ${{ secrets.MD_OPENDATA_PASSWORD }}
          MD_OPENDATA_APP_TOKEN: ${{ secrets.MD_OPENDATA_APP_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PR_AUDIENCE_ID: '120249632120970142'   # "MD Probate PRs" in Pages of Purpose Ads
          PR_SKIP_SUPPLEMENT: ${{ secrets.PR_SKIP_SUPPLEMENT }}
        run: |
          ARGS="--months ${{ github.event.inputs.months || '12' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python pr_audience.py $ARGS
